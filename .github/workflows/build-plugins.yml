name: Build PFS plugins

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            generator: Visual Studio 17 2022
            arch: -A x64
            artifact: pfs-windows-x64
          - name: macOS Universal
            os: macos-latest
            generator: Xcode
            arch: -DCMAKE_OSX_ARCHITECTURES=arm64\;x86_64
            artifact: pfs-macos-universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build -G "${{ matrix.generator }}"
          ${{ matrix.arch }}
          -DCMAKE_BUILD_TYPE=Release
          -DPFS_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Test sequencer
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item -Recurse "build/PFS_artefacts/Release/VST3/PFS.vst3" artifacts/
          Copy-Item "build/PFS_artefacts/Release/Standalone/PFS.exe" artifacts/
      - name: Stage macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p artifacts
          cp -R build/PFS_artefacts/Release/VST3/PFS.vst3 artifacts/
          cp -R build/PFS_artefacts/Release/AU/PFS.component artifacts/
          cp -R build/PFS_artefacts/Release/Standalone/PFS.app artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/
          if-no-files-found: error
